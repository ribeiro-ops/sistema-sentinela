<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Alta do Paciente</title>

  <link rel="stylesheet"
        href="css/style.css">

  <!-- Biblioteca para geração do PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<div class="container">

  <div style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
  ">

    <h2 style="margin:0;">
      🏠 Alta do Paciente
    </h2>

    <button onclick="voltar()">
      ← Voltar
    </button>

  </div>


  <!-- DADOS DO PACIENTE -->
  <div class="card">

    <h3>Dados do Paciente</h3>

    <label>Paciente</label>

    <input
      type="text"
      id="paciente"
      readonly
    >

  </div>


  <!-- FORMULÁRIO DE ALTA -->
  <div class="card">

    <h3>Formulário de Alta</h3>


    <label>Condição na alta</label>

    <select id="condicao">

      <option value="">
        Selecione
      </option>

      <option value="Estável">
        Estável
      </option>

      <option value="Melhorado">
        Melhorado
      </option>

      <option value="Recuperado">
        Recuperado
      </option>

      <option value="Encaminhado">
        Encaminhado para outro serviço
      </option>

    </select>


    <label>Orientações ao paciente</label>

    <textarea
      id="orientacoes"
      placeholder="Digite as orientações dadas ao paciente..."
    ></textarea>


    <label>Recomendações</label>

    <textarea
      id="recomendacoes"
      placeholder="Digite recomendações, cuidados ou repouso..."
    ></textarea>


    <label>Retorno</label>

    <select id="retorno">

      <option value="">
        Selecione
      </option>

      <option value="Sem retorno">
        Sem necessidade de retorno
      </option>

      <option value="Retorno em 7 dias">
        Retorno em 7 dias
      </option>

      <option value="Retorno em 15 dias">
        Retorno em 15 dias
      </option>

      <option value="Retorno em 30 dias">
        Retorno em 30 dias
      </option>

      <option value="Retorno conforme necessidade">
        Retorno conforme necessidade
      </option>

    </select>


    <label>Observações da alta</label>

    <textarea
      id="observacoes"
      placeholder="Observações adicionais..."
    ></textarea>


    <button
      onclick="finalizarAlta()"
      style="
        background:#28a745;
        color:white;
        margin-top:15px;
      "
    >
      🏠 Confirmar Alta
    </button>

  </div>


  <!-- ÁREA APÓS FINALIZAR -->
  <div
    id="resultado-alta"
    class="card"
    style="display:none; text-align:center;"
  >

    <h3>
      ✅ Alta registrada com sucesso!
    </h3>

    <p>
      O paciente foi finalizado no sistema.
    </p>

    <button
      onclick="baixarPDF()"
      style="
        background:#dc3545;
        color:white;
        margin-top:10px;
      "
    >
      📄 Baixar PDF da Alta
    </button>

    <br><br>

    <button
      onclick="voltar()"
    >
      ← Voltar ao início
    </button>

  </div>

</div>


<script>

// ==========================================
// PARÂMETROS DA URL
// ==========================================

const parametros =
  new URLSearchParams(window.location.search);

const pacienteId =
  parametros.get("pacienteId");

const nome =
  parametros.get("nome");


// ==========================================
// VARIÁVEIS DA ALTA
// ==========================================

let dadosAlta = null;


// ==========================================
// MOSTRAR PACIENTE
// ==========================================

document.getElementById("paciente").value =
  nome || "";


// ==========================================
// VOLTAR
// ==========================================

function voltar() {

  window.location.href =
    "index.html";

}


// ==========================================
// FINALIZAR ALTA
// ==========================================

function finalizarAlta() {

  if (!pacienteId) {

    alert(
      "Erro: paciente não identificado."
    );

    return;
  }


  const condicao =
    document.getElementById("condicao").value;


  const orientacoes =
    document.getElementById("orientacoes").value;


  const recomendacoes =
    document.getElementById("recomendacoes").value;


  const retorno =
    document.getElementById("retorno").value;


  const observacoes =
    document.getElementById("observacoes").value;


  // ========================================
  // VALIDAÇÃO
  // ========================================

  if (!condicao) {

    alert(
      "Selecione a condição do paciente na alta."
    );

    return;
  }


  // ========================================
  // OBJETO DA ALTA
  // ========================================

  dadosAlta = {

    pacienteId: pacienteId,

    paciente: nome,

    condicao: condicao,

    orientacoes: orientacoes,

    recomendacoes: recomendacoes,

    retorno: retorno,

    observacoes: observacoes,

    dataHora: new Date()

  };


  // ========================================
  // ENVIAR PARA O SERVIDOR
  // ========================================

  fetch("/alta", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      pacienteId: pacienteId,

      paciente: nome,

      condicao: condicao,

      orientacoes: orientacoes,

      recomendacoes: recomendacoes,

      retorno: retorno,

      observacoes: observacoes

    })

  })

  .then(async response => {

    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.erro ||
        "Erro ao registrar alta."
      );

    }


    return data;

  })


  .then(() => {

    // ======================================
    // ALTA REGISTRADA
    // ======================================

    alert(
      "✅ Alta registrada com sucesso!"
    );


    // Esconde formulário
    document.querySelectorAll(".card")[1]
      .style.display = "none";


    // Mostra resultado
    document.getElementById(
      "resultado-alta"
    ).style.display = "block";

  })


  .catch(error => {

    console.error(error);


    alert(
      error.message
    );

  });

}


// ==========================================
// GERAR PDF
// ==========================================

function baixarPDF() {

  if (!dadosAlta) {

    alert(
      "Não existem dados de alta para gerar o PDF."
    );

    return;
  }


  const {
    jsPDF
  } = window.jspdf;


  const doc =
    new jsPDF();


  // ========================================
  // DATA E HORA
  // ========================================

  const data =
    new Date(dadosAlta.dataHora);


  const dataFormatada =
    data.toLocaleDateString("pt-BR");


  const horaFormatada =
    data.toLocaleTimeString(
      "pt-BR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );


  // ========================================
  // CABEÇALHO
  // ========================================

  doc.setFontSize(18);

  doc.setFont("helvetica", "bold");

  doc.text(
    "DOCUMENTO DE ALTA DO PACIENTE",
    105,
    25,
    {
      align: "center"
    }
  );


  doc.setFontSize(11);

  doc.setFont("helvetica", "normal");

  doc.text(
    "Sistema Sentinela - Atendimento Hospitalar",
    105,
    33,
    {
      align: "center"
    }
  );


  // Linha
  doc.line(
    20,
    40,
    190,
    40
  );


  // ========================================
  // DADOS DO PACIENTE
  // ========================================

  doc.setFontSize(13);

  doc.setFont("helvetica", "bold");

  doc.text(
    "DADOS DO PACIENTE",
    20,
    52
  );


  doc.setFontSize(11);

  doc.setFont("helvetica", "normal");

  doc.text(
    "Paciente: " +
    (dadosAlta.paciente || "Não informado"),
    20,
    62
  );


  doc.text(
    "ID do paciente: " +
    (dadosAlta.pacienteId || "Não informado"),
    20,
    70
  );


  doc.text(
    "Data da alta: " +
    dataFormatada,
    20,
    78
  );


  doc.text(
    "Horário: " +
    horaFormatada,
    20,
    86
  );


  // ========================================
  // CONDIÇÃO
  // ========================================

  doc.setFontSize(13);

  doc.setFont("helvetica", "bold");

  doc.text(
    "CONDIÇÃO NA ALTA",
    20,
    102
  );


  doc.setFontSize(11);

  doc.setFont("helvetica", "normal");

  doc.text(
    dadosAlta.condicao,
    20,
    112
  );


  // ========================================
  // ORIENTAÇÕES
  // ========================================

  let y = 128;


  doc.setFontSize(13);

  doc.setFont("helvetica", "bold");

  doc.text(
    "ORIENTAÇÕES AO PACIENTE",
    20,
    y
  );


  y += 10;


  doc.setFontSize(11);

  doc.setFont("helvetica", "normal");


  const orientacoes =
    dadosAlta.orientacoes ||
    "Nenhuma orientação registrada.";


  const linhasOrientacoes =
    doc.splitTextToSize(
      orientacoes,
      170
    );


  doc.text(
    linhasOrientacoes,
    20,
    y
  );


  y +=
    linhasOrientacoes.length * 6 +
    10;


  // ========================================
  // RECOMENDAÇÕES
  // ========================================

  doc.setFontSize(13);

  doc.setFont("helvetica", "bold");

  doc.text(
    "RECOMENDAÇÕES",
    20,
    y
  );


  y += 10;


  doc.setFontSize(11);

  doc.setFont("helvetica", "normal");


  const recomendacoes =
    dadosAlta.recomendacoes ||
    "Nenhuma recomendação registrada.";


  const linhasRecomendacoes =
    doc.splitTextToSize(
      recomendacoes,
      170
    );


  doc.text(
    linhasRecomendacoes,
    20,
    y
  );


  y +=
    linhasRecomendacoes.length * 6 +
    10;


  // ========================================
  // RETORNO
  // ========================================

  doc.setFontSize(13);

  doc.setFont("helvetica", "bold");

  doc.text(
    "RETORNO",
    20,
    y
  );


  y += 10;


  doc.setFontSize(11);

  doc.setFont("helvetica", "normal");

  doc.text(
    dadosAlta.retorno ||
    "Não informado",
    20,
    y
  );


  y += 18;


  // ========================================
  // OBSERVAÇÕES
  // ========================================

  doc.setFontSize(13);

  doc.setFont("helvetica", "bold");

  doc.text(
    "OBSERVAÇÕES DA ALTA",
    20,
    y
  );


  y += 10;


  doc.setFontSize(11);

  doc.setFont("helvetica", "normal");


  const observacoes =
    dadosAlta.observacoes ||
    "Nenhuma observação registrada.";


  const linhasObservacoes =
    doc.splitTextToSize(
      observacoes,
      170
    );


  doc.text(
    linhasObservacoes,
    20,
    y
  );


  // ========================================
  // RODAPÉ
  // ========================================

  doc.setFontSize(9);

  doc.setFont("helvetica", "normal");

  doc.text(
    "Documento gerado pelo Sistema Sentinela.",
    105,
    280,
    {
      align: "center"
    }
  );


  doc.text(
    dataFormatada +
    " às " +
    horaFormatada,
    105,
    286,
    {
      align: "center"
    }
  );


  // ========================================
  // SALVAR PDF
  // ========================================

  const nomeArquivo =
    "alta-" +
    (dadosAlta.paciente || "paciente")
      .replace(/[^a-zA-Z0-9À-ÿ]/g, "-")
      .toLowerCase() +
    ".pdf";


  doc.save(nomeArquivo);

}

</script>

</body>
</html>
