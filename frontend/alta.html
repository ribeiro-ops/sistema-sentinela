<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Alta do Paciente</title>

  <link rel="stylesheet"
        href="css/style.css">
</head>

<body>

<div class="container">

  <div style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
  ">

    <h2 style="margin:0;">
      🏠 Alta do Paciente
    </h2>

    <button onclick="voltar()">
      ← Voltar
    </button>

  </div>


  <div class="card">

    <h3>Dados do Paciente</h3>

    <label>Paciente</label>

    <input
      type="text"
      id="paciente"
      readonly
    >

  </div>


  <div class="card">

    <h3>Formulário de Alta</h3>


    <label>Condição na alta</label>

    <select id="condicao">
      <option value="">
        Selecione
      </option>

      <option value="Estável">
        Estável
      </option>

      <option value="Melhorado">
        Melhorado
      </option>

      <option value="Recuperado">
        Recuperado
      </option>

      <option value="Encaminhado">
        Encaminhado para outro serviço
      </option>
    </select>


    <label>Orientações ao paciente</label>

    <textarea
      id="orientacoes"
      placeholder="Digite as orientações dadas ao paciente..."
    ></textarea>


    <label>Recomendações</label>

    <textarea
      id="recomendacoes"
      placeholder="Digite recomendações, cuidados ou repouso..."
    ></textarea>


    <label>Retorno</label>

    <select id="retorno">

      <option value="">
        Selecione
      </option>

      <option value="Sem retorno">
        Sem necessidade de retorno
      </option>

      <option value="Retorno em 7 dias">
        Retorno em 7 dias
      </option>

      <option value="Retorno em 15 dias">
        Retorno em 15 dias
      </option>

      <option value="Retorno em 30 dias">
        Retorno em 30 dias
      </option>

      <option value="Retorno conforme necessidade">
        Retorno conforme necessidade
      </option>

    </select>


    <label>Observações da alta</label>

    <textarea
      id="observacoes"
      placeholder="Observações adicionais..."
    ></textarea>


    <button
      onclick="finalizarAlta()"
      style="
        background:#28a745;
        color:white;
        margin-top:15px;
      "
    >
      🏠 Confirmar Alta
    </button>

  </div>

</div>


<script>

const parametros =
  new URLSearchParams(window.location.search);

const pacienteId =
  parametros.get("pacienteId");

const nome =
  parametros.get("nome");


document.getElementById("paciente").value =
  nome || "";


function voltar() {
  window.location.href = "index.html";
}


function finalizarAlta() {

  if (!pacienteId) {

    alert(
      "Erro: paciente não identificado."
    );

    return;
  }


  const condicao =
    document.getElementById("condicao").value;

  const orientacoes =
    document.getElementById("orientacoes").value;

  const recomendacoes =
    document.getElementById("recomendacoes").value;

  const retorno =
    document.getElementById("retorno").value;

  const observacoes =
    document.getElementById("observacoes").value;


  if (!condicao) {

    alert(
      "Selecione a condição do paciente na alta."
    );

    return;
  }


  fetch("/alta", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      pacienteId: pacienteId,

      paciente: nome,

      condicao: condicao,

      orientacoes: orientacoes,

      recomendacoes: recomendacoes,

      retorno: retorno,

      observacoes: observacoes

    })

  })

  .then(async response => {

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.erro ||
        "Erro ao registrar alta."
      );

    }

    return data;

  })

  .then(() => {

    alert(
      "✅ Alta registrada com sucesso!"
    );

    window.location.href =
      "index.html";

  })

  .catch(error => {

    console.error(error);

    alert(
      error.message
    );

  });

}

</script>

</body>
</html>
