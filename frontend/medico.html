<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

  <!-- Cabeçalho com botão da TV -->
  <div class="acoes-paciente">
    <h2 style="margin:0;">🩺 Painel Médico</h2>

    <button
      class="btn-abrir-tv"
      onclick="window.open('tv.html','_blank')"
    >
      📺 Abrir Tela da TV
    </button>
  </div>


  <!-- Campo criado para informar o consultório -->
  <div class="consultorio-input">

    <label>
      Meu Consultório:
    </label>

    <input
      type="text"
      id="consultorio-num"
      value="01"
    >

    <span
      style="
        color:#666;
        font-size:13px;
      "
    >
      Este número será exibido na TV ao chamar o paciente.
    </span>

  </div>


  <div id="triagens"></div>

  <hr>

  <h3>Consulta</h3>


  <input
    id="paciente"
    placeholder="Paciente"
    readonly
  >


  <input
    id="diagnostico"
    placeholder="Diagnóstico"
  >


  <!-- AVISO DE ALERGIA -->

  <div
    id="aviso-alergia"
    style="
      display:none;
      margin:10px 0;
      padding:12px;
      border-radius:6px;
      background:#fff3cd;
      border:1px solid #ffc107;
      color:#856404;
    "
  >
  </div>


  <select id="medicacao">

    <option value="">
      Selecione a medicação
    </option>

  </select>


  <textarea
    id="obs"
    placeholder="Observações"
  ></textarea>


  <button onclick="salvar()">
    Salvar
  </button>

</div>


<script>

let triagensCarregadas = [];

let pacienteSelecionado = null;

let medicamentosCarregados = [];


/* =========================================================
   NORMALIZAR TEXTO
========================================================= */

function normalizarTexto(texto) {

  return String(texto || "")
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .toLowerCase()
    .trim();

}


/* =========================================================
   PEGAR ALERGIAS DO PACIENTE
========================================================= */

function obterAlergiasPaciente() {

  if (!pacienteSelecionado) {
    return [];
  }


  if (
    !pacienteSelecionado.alergia
  ) {
    return [];
  }


  return String(
    pacienteSelecionado.alergia
  )
    .split(/[,;\/\n]+/)
    .map(
      item =>
        normalizarTexto(item)
    )
    .filter(Boolean);

}


/* =========================================================
   VERIFICAR MEDICAMENTO
========================================================= */

function medicamentoTemAlergia(
  medicamento
) {

  const alergias =
    obterAlergiasPaciente();


  if (
    !medicamento ||
    alergias.length === 0
  ) {
    return false;
  }


  const medicamentoNormalizado =
    normalizarTexto(
      medicamento
    );


  return alergias.includes(
    medicamentoNormalizado
  );

}


/* =========================================================
   ATUALIZAR LISTA DE MEDICAÇÕES
========================================================= */

function atualizarBloqueioMedicacoes() {

  const select =
    document.getElementById(
      "medicacao"
    );


  const alergias =
    obterAlergiasPaciente();


  Array.from(
    select.options
  ).forEach(option => {

    if (!option.value) {
      return;
    }


    const bloqueado =
      alergias.includes(
        normalizarTexto(
          option.value
        )
      );


    option.disabled =
      bloqueado;


    if (bloqueado) {

      option.textContent =
        "🚫 ALERGIA - " +
        option.value;

    }

    else {

      option.textContent =
        option.value;

    }

  });


  /* =====================================================
     AVISO VISUAL
  ====================================================== */

  const aviso =
    document.getElementById(
      "aviso-alergia"
    );


  if (alergias.length > 0) {

    aviso.style.display =
      "block";


    aviso.innerHTML =
      "<b>⚠️ ATENÇÃO: alergias registradas</b>" +
      "<br><br>" +
      "O paciente possui alergia a: " +
      "<b>" +
      pacienteSelecionado.alergia +
      "</b>" +
      "<br><br>" +
      "Esses medicamentos estão bloqueados na lista.";

  }

  else {

    aviso.style.display =
      "none";

    aviso.innerHTML =
      "";

  }

}


/* =========================================================
   CARREGAR FILA MÉDICA
========================================================= */

function carregar() {

  fetch("/triagens")

    .then(async r => {

      if (!r.ok) {

        throw new Error(
          "Erro HTTP " +
          r.status
        );

      }

      return r.json();

    })

    .then(data => {

      console.log(
        "TRIAGENS RECEBIDAS PELO MÉDICO:",
        data
      );


      triagensCarregadas =
        data;


      const div =
        document.getElementById(
          "triagens"
        );


      div.innerHTML = "";


      if (
        !Array.isArray(data) ||
        data.length === 0
      ) {

        div.innerHTML = `

          <p
            style="
              color:#888;
              text-align:center;
              padding:20px;
            "
          >
            Nenhum paciente na fila médica.
          </p>

        `;

        return;
      }


      data.forEach(
        (t, index) => {

          let statusTexto = "";

          let botoes = "";


          if (
            t.status ===
            "aguardando_medico"
          ) {

            statusTexto = `

              <span
                style="
                  color:#1976d2;
                "
              >
                🩺 Aguardando atendimento
              </span>

            `;


            botoes = `

              <button
                onclick="selecionar(${index})"
              >
                Atender
              </button>


              <button
                class="btn-tv"
                onclick="chamarNaTV('${String(t.nome || "").replace(/'/g, "\\'")}')"
              >
                📺 Chamar na TV
              </button>

            `;

          }


          else if (
            t.status ===
            "aguardando_alta"
          ) {

            statusTexto = `

              <span
                style="
                  color:#e67e22;
                "
              >
                🏠 Aguardando alta
              </span>

            `;


            botoes = `

              <button
                disabled
                style="
                  opacity:0.6;
                  cursor:not-allowed;
                "
              >
                ✅ Consulta realizada
              </button>


              <button
                class="btn-tv"
                onclick="chamarNaTV('${String(t.nome || "").replace(/'/g, "\\'")}')"
              >
                📺 Chamar na TV
              </button>


              <button
                class="btn-alta"
                onclick="darAlta(${index})"
              >
                🏠 Dar Alta
              </button>

            `;

          }


          div.innerHTML += `

            <div class="card">

              <h3>
                ${t.nome}
              </h3>


              <p>

                <b>Status:</b>

                ${statusTexto}

              </p>


              <p>

                <b>Sintoma:</b>

                ${t.sintoma || "Não informado"}

              </p>


              <p>

                <b>Temperatura:</b>

                ${t.temperatura || "Não informada"}°C

              </p>


              <p>

                <b>Risco:</b>

                <span
                  class="${t.risco}"
                >
                  ${t.risco || "Não informado"}
                </span>

              </p>


              <p>

                <b>Alergia:</b>

                ${
                  t.alergia ||
                  "Nenhuma"
                }

              </p>


              <p>

                <b>Observação:</b>

                ${
                  t.observacao ||
                  "Nenhuma"
                }

              </p>


              <div
                style="
                  display:flex;
                  gap:8px;
                  flex-wrap:wrap;
                "
              >

                ${botoes}

              </div>

            </div>

          `;

        }
      );

    })

    .catch(error => {

      console.error(
        "ERRO AO CARREGAR FILA MÉDICA:",
        error
      );


      document.getElementById(
        "triagens"
      ).innerHTML = `

        <p style="color:red;">

          Erro ao carregar fila médica:
          ${error.message}

        </p>

      `;

    });

}


/* =========================================================
   CHAMAR PACIENTE NA TV
========================================================= */

function chamarNaTV(nome) {

  const consultorio =
    document.getElementById(
      "consultorio-num"
    ).value ||
    "01";


  fetch(
    "/tv/chamar",
    {

      method:"POST",

      headers:{
        "Content-Type":
          "application/json"
      },

      body:JSON.stringify({

        localTipo:
          "CONSULTÓRIO",

        localNumero:
          consultorio,

        paciente:
          nome

      })

    }
  )

  .then(async r => {

    const data =
      await r.json();


    if (!r.ok) {

      throw new Error(
        data.erro ||
        "Erro ao chamar paciente na TV."
      );

    }


    return data;

  })

  .then(() => {

    alert(
      "✅ " +
      nome +
      " foi chamado na TV para o Consultório " +
      consultorio +
      "!"
    );

  })

  .catch(error => {

    console.error(error);

    alert(error.message);

  });

}


/* =========================================================
   DAR ALTA
========================================================= */

function darAlta(index) {

  const t =
    triagensCarregadas[index];


  if (!t) {

    alert(
      "Paciente não encontrado."
    );

    return;
  }


  if (
    t.status !==
    "aguardando_alta"
  ) {

    alert(
      "Este paciente ainda não possui uma consulta finalizada."
    );

    return;
  }


  if (!t.pacienteId) {

    alert(
      "Erro: esta triagem não possui pacienteId."
    );

    return;
  }


  const pacienteId =
    encodeURIComponent(
      t.pacienteId
    );


  const nome =
    encodeURIComponent(
      t.nome
    );


  window.location.href =
    `alta.html?pacienteId=${pacienteId}&nome=${nome}`;

}


/* =========================================================
   SELECIONAR PACIENTE
========================================================= */

function selecionar(index) {

  const t =
    triagensCarregadas[index];


  if (!t) {

    alert(
      "Paciente não encontrado."
    );

    return;
  }


  if (
    t.status !==
    "aguardando_medico"
  ) {

    alert(
      "Este paciente já foi atendido e está aguardando alta."
    );

    return;
  }


  if (!t.pacienteId) {

    alert(
      "Erro: esta triagem não possui pacienteId."
    );

    return;
  }


  pacienteSelecionado =
    t;


  document.getElementById(
    "paciente"
  ).value =
    t.nome;


  document.getElementById(
    "obs"
  ).value =
    t.observacao || "";


  document.getElementById(
    "diagnostico"
  ).value =
    "";


  document.getElementById(
    "medicacao"
  ).value =
    "";


  /* Atualiza bloqueios */

  atualizarBloqueioMedicacoes();


  if (
    t.alergia &&
    t.alergia.trim() !== ""
  ) {

    alert(
      "⚠️ ATENÇÃO\n\n" +
      "Paciente: " +
      t.nome +
      "\nAlergia: " +
      t.alergia +
      "\n\nOs medicamentos correspondentes serão bloqueados."
    );

  }


  console.log(
    "Paciente selecionado para atendimento:",
    pacienteSelecionado
  );

}


/* =========================================================
   CARREGAR MEDICAÇÕES
========================================================= */

function carregarMedicacoes() {

  fetch(
    "/lista-medicacoes"
  )

  .then(r => {

    if (!r.ok) {

      throw new Error(
        "Erro ao carregar medicações."
      );

    }

    return r.json();

  })

  .then(data => {

    medicamentosCarregados =
      data;


    const select =
      document.getElementById(
        "medicacao"
      );


    select.innerHTML = `

      <option value="">
        Selecione a medicação
      </option>

    `;


    data.forEach(
      med => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          med;


        option.textContent =
          med;


        select.appendChild(
          option
        );

      }
    );


    /*
      Se o paciente já estiver selecionado,
      aplica imediatamente os bloqueios.
    */

    if (
      pacienteSelecionado
    ) {

      atualizarBloqueioMedicacoes();

    }

  })

  .catch(error => {

    console.error(
      "Erro ao carregar medicações:",
      error
    );

  });

}


/* =========================================================
   SALVAR CONSULTA
========================================================= */

function salvar() {

  if (!pacienteSelecionado) {

    alert(
      "Selecione um paciente clicando em Atender."
    );

    return;
  }


  const diagnostico =
    document.getElementById(
      "diagnostico"
    ).value;


  const medicacao =
    document.getElementById(
      "medicacao"
    ).value;


  const obs =
    document.getElementById(
      "obs"
    ).value;


  if (
    !diagnostico.trim()
  ) {

    alert(
      "Informe o diagnóstico."
    );

    return;
  }


  /* =====================================================
     VERIFICAÇÃO EXTRA NO FRONTEND
  ====================================================== */

  if (
    medicamentoTemAlergia(
      medicacao
    )
  ) {

    alert(
      "🚫 NÃO É POSSÍVEL CONTINUAR\n\n" +
      "Paciente: " +
      pacienteSelecionado.nome +
      "\n\n" +
      "O paciente possui alergia registrada a:\n" +
      pacienteSelecionado.alergia +
      "\n\n" +
      "Selecione outro medicamento."
    );

    return;

  }


  fetch(
    "/consulta",
    {

      method:"POST",

      headers:{
        "Content-Type":
          "application/json"
      },

      body:JSON.stringify({

        pacienteId:
          pacienteSelecionado.pacienteId,

        paciente:
          pacienteSelecionado.nome,

        diagnostico,

        medicacao,

        obs

      })

    }
  )

  .then(async r => {

    const data =
      await r.json();


    if (!r.ok) {

      throw new Error(
        data.erro ||
        "Erro ao salvar consulta."
      );

    }


    return data;

  })

  .then(() => {

    alert(
      "✅ Consulta finalizada com sucesso!\n\n" +
      "O paciente continuará na fila aguardando alta."
    );


    pacienteSelecionado =
      null;


    document.getElementById(
      "paciente"
    ).value =
      "";


    document.getElementById(
      "diagnostico"
    ).value =
      "";


    document.getElementById(
      "medicacao"
    ).value =
      "";


    document.getElementById(
      "obs"
    ).value =
      "";


    document.getElementById(
      "aviso-alergia"
    ).style.display =
      "none";


    carregar();

  })

  .catch(error => {

    console.error(error);

    alert(error.message);

  });

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

carregar();

carregarMedicacoes();


/* Atualiza a fila automaticamente */

setInterval(
  carregar,
  3000
);

</script>

</body>
</html>
