<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
<h2>Atendimento</h2>

<input id="nome" placeholder="Nome">
<input id="cpf" placeholder="CPF">
<input id="data" placeholder="Data de nascimento">
<input id="sexo" placeholder="Sexo">
<input id="nomeResponsavel" placeholder="Nome do responsável">
<input id="estadoCivil" placeholder="Estado civil">
<input id="endereco" placeholder="Endereço">
<input id="telefone" placeholder="Telefone">
<input id="contatoEmergencia" placeholder="Contato de emergência">


<select id="tipo">
  <option>Convenio</option>
  <option>Particular</option>
</select>

<input type="file" id="foto">

<button onclick="cadastrar()">Cadastrar</button>
</div>

<script>
function cadastrar() {
  fetch("http://localhost:3000/atendimento", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      nome: document.getElementById("nome").value,
      cpf: document.getElementById("cpf").value,
      data: document.getElementById("data").value,
      sexo: document.getElementById("sexo").value,
      nomeResponsavel: document.getElementById("nomeResponsavel").value,
      estadoCivil: document.getElementById("estadoCivil").value,
      endereco: document.getElementById("endereco").value,
      telefone: document.getElementById("telefone").value,
      contatoEmergencia: document.getElementById("contatoEmergencia").value,
      tipo: document.getElementById("tipo").value
    })
  })
  .then(response => {
    if (!response.ok) {
      throw new Error("Erro ao cadastrar paciente");
    }

    return response.json();
  })
  .then(data => {
    console.log("Paciente salvo:", data);
    alert("Paciente cadastrado com sucesso!");
  })
  .catch(error => {
    console.error(error);
    alert("Erro ao salvar o paciente.");
  });
}

</script>
</body>
</html>
