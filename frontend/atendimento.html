<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Atendimento</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

  <h2>Atendimento</h2>
  <p>Cadastre os dados básicos do paciente para iniciar o atendimento.</p>

  <form id="formAtendimento">

    <!-- DADOS DO PACIENTE -->

    <h3>Dados do paciente</h3>

    <label for="nome">Nome completo *</label>
    <input
      type="text"
      id="nome"
      placeholder="Digite o nome completo"
      required
    >

    <label for="cpf">CPF *</label>
    <input
      type="text"
      id="cpf"
      placeholder="000.000.000-00"
      maxlength="14"
      required
    >

    <label for="data">Data de nascimento *</label>
    <input
      type="date"
      id="data"
      required
    >

    <label for="sexo">Sexo *</label>
    <select id="sexo" required>
      <option value="">Selecione</option>
      <option value="Feminino">Feminino</option>
      <option value="Masculino">Masculino</option>
      <option value="Outro">Outro</option>
      <option value="Não informado">Não informado</option>
    </select>


    <!-- CONTATO -->

    <h3>Contato</h3>

    <label for="telefone">Telefone</label>
    <input
      type="tel"
      id="telefone"
      placeholder="(00) 00000-0000"
      maxlength="15"
    >


    <!-- ATENDIMENTO -->

    <h3>Informações do atendimento</h3>

    <label for="tipo">Tipo de atendimento *</label>

    <select id="tipo" required>
      <option value="">Selecione</option>
      <option value="Particular">Particular</option>
      <option value="Convenio">Convênio</option>
      <option value="SUS">SUS</option>
    </select>


    <div id="dadosConvenio" style="display: none;">

      <label for="convenio">Convênio</label>

      <select id="convenio">

        <option value="">Selecione</option>

        <option value="Unimed">Unimed</option>
        <option value="Bradesco Saúde">Bradesco Saúde</option>
        <option value="Amil">Amil</option>
        <option value="SulAmérica">SulAmérica</option>
        <option value="NotreDame">NotreDame</option>
        <option value="Outro">Outro</option>

      </select>


      <label for="numeroCarteirinha">
        Número da carteirinha
      </label>

      <input
        type="text"
        id="numeroCarteirinha"
        placeholder="Número da carteirinha"
      >

    </div>


    <label for="motivo">Motivo da visita *</label>

    <select id="motivo" required>

      <option value="">Selecione</option>

      <option value="Consulta">
        Consulta
      </option>

      <option value="Retorno">
        Retorno
      </option>

      <option value="Exame">
        Exame
      </option>

      <option value="Acompanhamento">
        Acompanhamento
      </option>

      <option value="Urgência">
        Urgência
      </option>

      <option value="Outro">
        Outro
      </option>

    </select>


    <label for="observacoes">
      Observações
    </label>

    <textarea
      id="observacoes"
      rows="4"
      placeholder="Alguma informação importante..."
    ></textarea>


    <!-- FOTO -->

    <h3>Foto</h3>

    <label for="foto">
      Foto do paciente
    </label>

    <input
      type="file"
      id="foto"
      accept="image/*"
    >


    <!-- BOTÕES -->

    <div class="botoes">

      <button
        type="reset"
        class="btn-limpar"
      >
        Limpar
      </button>

      <button
        type="submit"
        class="btn-cadastrar"
      >
        Cadastrar paciente
      </button>

    </div>

  </form>

</div>


<script>

/* ============================
   MOSTRAR CONVÊNIO
============================ */

const tipo = document.getElementById("tipo");

const dadosConvenio =
  document.getElementById("dadosConvenio");

tipo.addEventListener("change", function () {

  if (this.value === "Convenio") {

    dadosConvenio.style.display = "block";

  } else {

    dadosConvenio.style.display = "none";

    document.getElementById("convenio").value = "";
    document.getElementById("numeroCarteirinha").value = "";

  }

});


/* ============================
   MÁSCARA CPF
============================ */

document
  .getElementById("cpf")
  .addEventListener("input", function () {

    let valor = this.value.replace(/\D/g, "");

    valor = valor.substring(0, 11);

    valor = valor.replace(
      /(\d{3})(\d)/,
      "$1.$2"
    );

    valor = valor.replace(
      /(\d{3})(\d)/,
      "$1.$2"
    );

    valor = valor.replace(
      /(\d{3})(\d{1,2})$/,
      "$1-$2"
    );

    this.value = valor;

  });


/* ============================
   MÁSCARA TELEFONE
============================ */

document
  .getElementById("telefone")
  .addEventListener("input", function () {

    let valor = this.value.replace(/\D/g, "");

    valor = valor.substring(0, 11);

    if (valor.length <= 10) {

      valor = valor.replace(
        /(\d{2})(\d)/,
        "($1) $2"
      );

      valor = valor.replace(
        /(\d{4})(\d)/,
        "$1-$2"
      );

    } else {

      valor = valor.replace(
        /(\d{2})(\d)/,
        "($1) $2"
      );

      valor = valor.replace(
        /(\d{5})(\d)/,
        "$1-$2"
      );

    }

    this.value = valor;

  });


/* ============================
   CADASTRAR
============================ */

document
  .getElementById("formAtendimento")
  .addEventListener("submit", async function (event) {

    event.preventDefault();

    const paciente = {

      nome:
        document.getElementById("nome").value,

      cpf:
        document.getElementById("cpf").value,

      data:
        document.getElementById("data").value,

      sexo:
        document.getElementById("sexo").value,

      telefone:
        document.getElementById("telefone").value,

      tipo:
        document.getElementById("tipo").value,

      convenio:
        document.getElementById("convenio").value,

      numeroCarteirinha:
        document.getElementById("numeroCarteirinha").value,

      motivo:
        document.getElementById("motivo").value,

      observacoes:
        document.getElementById("observacoes").value

    };


    try {

      const response = await fetch(
        "http://localhost:3000/atendimento",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify(paciente)
        }
      );


      if (!response.ok) {

        throw new Error(
          "Erro ao cadastrar paciente"
        );

      }


      const data = await response.json();

      console.log(
        "Paciente salvo:",
        data
      );


      alert(
        "Paciente cadastrado com sucesso!"
      );


      document
        .getElementById("formAtendimento")
        .reset();


      dadosConvenio.style.display = "none";


    } catch (error) {

      console.error(error);

      alert(
        "Erro ao salvar o paciente."
      );

    }

  });

</script>

</body>

</html>
